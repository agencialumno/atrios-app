name: iOS TestFlight

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_DEVELOPMENT_TEAM: KH97Q8M556
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
      DATABASE_URL: "postgresql://build:build@localhost:5432/build"
      JWT_SECRET: "valor-fictício-apenas-para-o-build-mobile"
      STRIPE_SECRET_KEY: "sk_test_build_placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_build_placeholder"
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Criar o .env.production para o build
        run: echo "VITE_API_URL=https://atrios-app-two.vercel.app" > .env.production

      - name: Conferir os icones (a Apple recusa transparencia)
        run: |
          if [ -d src-tauri/icons/ios ]; then
            for f in src-tauri/icons/ios/*.png; do
              if sips -g hasAlpha "$f" | grep -q "yes"; then
                echo "ERRO: o icone $f tem transparencia."
                exit 1
              fi
            done
          fi

      - name: Escolher o Xcode mais recente
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Guardar o cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependencias
        run: |
          brew install xcodegen || true
          bun install

      - name: Importar o certificado de distribuicao
        env:
          CERTIFICADO_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          SENHA_CERTIFICADO: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/atrios.keychain-db"
          KEYCHAIN_SENHA=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_SENHA" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_SENHA" "$KEYCHAIN_PATH"
          echo "$CERTIFICADO_P12" | base64 -d > "$RUNNER_TEMP/distribuicao.p12"
          security import "$RUNNER_TEMP/distribuicao.p12" -k "$KEYCHAIN_PATH" -P "$SENHA_CERTIFICADO" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_SENHA" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/distribuicao.p12"

      - name: Instalar o provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/atrios.mobileprovision"
          echo "Profile instalado:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: Preparar a chave da App Store Connect
        env:
          CHAVE_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$CHAVE_P8" > "$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"

      - name: Conferir as credenciais (sem mostrar segredos)
        run: |
          echo "Team ID: ${APPLE_DEVELOPMENT_TEAM} (${#APPLE_DEVELOPMENT_TEAM} caracteres, esperado 10)"
          echo "Key ID: ${#APPLE_API_KEY} caracteres (esperado 10)"
          echo "Issuer ID: ${#APPLE_API_ISSUER} caracteres (esperado 36)"
          ls -l "$APPLE_API_KEY_PATH"
          head -n 1 "$APPLE_API_KEY_PATH"
          tail -n 1 "$APPLE_API_KEY_PATH"
          wc -l "$APPLE_API_KEY_PATH"

      - name: Gerar o projeto iOS
        run: bun run tauri ios init

      - name: Usar os icones da Atrios no projeto iOS
        run: |
          DESTINO="src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset"
          ls "$DESTINO"
          cp src-tauri/icons/ios/*.png "$DESTINO/"
          for f in "$DESTINO"/*.png; do
            if sips -g hasAlpha "$f" | grep -q "yes"; then
              echo "ERRO: o icone $f tem transparencia."
              exit 1
            fi
          done

      - name: Compilar o app (gera apenas o xcarchive, sem assinar)
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
        run: bun run tauri ios build --export-method app-store-connect --build-number ${{ github.run_number }} || true

      - name: Verificar assinatura dentro do xcarchive (antes da exportacao)
        run: |
          ARCHIVE_APP=$(find src-tauri/gen/apple/build -name "*.xcarchive" -exec find {} -name "*.app" \; | head -n 1)
          echo "App dentro do archive: $ARCHIVE_APP"
          echo "=== codesign --verify --deep --strict (no xcarchive) ==="
          codesign --verify --deep --strict --verbose=4 "$ARCHIVE_APP" || echo "JA FALHA NO XCARCHIVE, antes da nossa exportacao"
          echo "=== Arquivos selados dentro do bundle ==="
          find "$ARCHIVE_APP" -type f | wc -l
          find "$ARCHIVE_APP" -type f

      - name: Assinar e empacotar o .ipa manualmente (do zero)
        run: |
          IDENTIDADE="Apple Distribution: Lumno Agencia de Marketing LTDA"
          ARCHIVE=$(find src-tauri/gen/apple/build -name "*.xcarchive" | head -n 1)
          APP_PATH=$(find "$ARCHIVE" -name "*.app" | head -n 1)
          echo "App: $APP_PATH"

          # Limpa atributos estendidos e arquivos AppleDouble (._*): o selo de recursos do codesign
          # (CodeResources) quebra se eles existirem ou mudarem depois da assinatura.
          limpar_bundle() {
            find "$1" \( -name "._*" -o -name ".DS_Store" \) -delete
            xattr -cr "$1"
          }

          echo "Removendo qualquer assinatura antiga antes de assinar do zero..."
          find "$APP_PATH" -name "_CodeSignature" -type d -prune -exec rm -rf {} +
          find "$APP_PATH" -name "CodeResources" -type f -delete
          rm -f "$APP_PATH/embedded.mobileprovision"

          echo "Copiando o provisioning profile para dentro do app..."
          cp "$HOME/Library/MobileDevice/Provisioning Profiles/atrios.mobileprovision" "$APP_PATH/embedded.mobileprovision"
          echo "Extraindo entitlements do provisioning profile (fora do bundle)..."
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"
          cat "$RUNNER_TEMP/entitlements.plist"

          # Limpeza final, depois de TODA operacao de cp: o cp do macOS copia xattrs
          limpar_bundle "$APP_PATH"

          echo "Codigo aninhado encontrado no bundle:"
          find "$APP_PATH" -mindepth 2 \( -name "*.framework" -o -name "*.appex" -o -name "*.dylib" \) || true

          echo "Assinando codigo aninhado, do mais fundo para o mais raso..."
          # -depth lista os filhos antes dos pais. Sem isso, o .framework seria assinado antes
          # do .dylib de dentro dele, e assinar o filho depois invalida o selo do pai.
          find "$APP_PATH" -mindepth 2 -depth \( -name "*.framework" -o -name "*.appex" -o -name "*.dylib" \) -print0 |
            while IFS= read -r -d '' item; do
              echo "  assinando $item"
              codesign --force --sign "$IDENTIDADE" "$item"
            done

          echo "Assinando o app principal..."
          codesign --force --sign "$IDENTIDADE" --entitlements "$RUNNER_TEMP/entitlements.plist" "$APP_PATH"

          echo "Verificando a assinatura recem-feita..."
          if ! codesign --verify --deep --strict --verbose=4 "$APP_PATH"; then
            echo "=== FALHOU. Diagnostico ==="
            echo "--- xattrs restantes ---"
            xattr -lr "$APP_PATH" || true
            echo "--- binarios Mach-O dentro do bundle ---"
            find "$APP_PATH" -type f -exec file {} + | grep "Mach-O" || true
            echo "--- symlinks ---"
            find "$APP_PATH" -type l || true
            exit 1
          fi

          echo "Empacotando o .ipa manualmente..."
          DESTINO="src-tauri/gen/apple/build/export-manual"
          rm -rf "$DESTINO"
          mkdir -p "$DESTINO/Payload"
          # ditto copia o bundle sem criar arquivos ._ e preserva symlinks e permissoes
          ditto --norsrc --noextattr --noqtn "$APP_PATH" "$DESTINO/Payload/$(basename "$APP_PATH")"
          (
            cd "$DESTINO"
            # COPYFILE_DISABLE evita ._* no zip; -y preserva symlinks; -X ignora atributos extras
            COPYFILE_DISABLE=1 zip -qryX "Atrios.ipa" "Payload"
          )
          echo "IPA criado:"
          find "$DESTINO" -name "*.ipa"

      - name: Verificar a assinatura do .ipa antes de enviar
        run: |
          IPA=$(find src-tauri/gen/apple/build/export-manual -name "*.ipa" | head -n 1)
          echo "Extraindo $IPA para inspecionar..."
          TEMP_DIR=$(mktemp -d)
          unzip -q "$IPA" -d "$TEMP_DIR"
          APP_PATH=$(find "$TEMP_DIR" -name "*.app" | head -n 1)
          echo "=== codesign --verify --deep --strict ==="
          codesign --verify --deep --strict --verbose=4 "$APP_PATH" || echo "FALHOU na verificacao"
          echo "=== Arquivos no .app exportado ==="
          find "$APP_PATH" -type f | wc -l
          find "$APP_PATH" -type f
          echo "=== codesign -dvvv (detalhes da assinatura) ==="
          codesign -dvvv "$APP_PATH" 2>&1

      - name: Guardar o arquivo .ipa
        uses: actions/upload-artifact@v4
        with:
          name: atrios-ipa
          path: src-tauri/gen/apple/build/**/*.ipa

      - name: Enviar ao App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          IPA=$(find src-tauri/gen/apple/build/export-manual -name "*.ipa" | head -n 1)
          echo "Enviando $IPA"
          TENTATIVAS=5
          ESPERA=90
          for i in $(seq 1 $TENTATIVAS); do
            echo "Tentativa $i de $TENTATIVAS..."
            if xcrun altool --upload-app --type ios --file "$IPA" -u "$APPLE_ID" -p "$APPLE_APP_PASSWORD"; then
              echo "Envio concluido com sucesso."
              exit 0
            fi
            echo "Falhou. Aguardando $ESPERA segundos antes de tentar de novo..."
            sleep $ESPERA
          done
          echo "Todas as tentativas falharam."
          exit 1
